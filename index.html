<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFC OMR Report</title>
    <script src="https://philogb.github.io/jit/static/v20/Jit/jit-yc.js"></script>
   <!-- <link rel="stylesheet" href="https://philogb.github.io/jit/static/v20/Jit/Examples/css/base.css"> -->
    <style type="text-css">
.jit-chart {
    margin:0;
    padding:0;
    font-family: "Lucida Grande", Verdana;
    font-size: 0.9em;
    text-align: center;
    background-color:#F2F2F2;
}

.jit-chart input,
.jit-chart select {
    font-size:0.9em;
}

.jit-chart table {
    margin-top:-10px;
    margin-left:7px;
}

.jit-chart h4 {
    font-size:1.1em;
    text-decoration:none;
    font-weight:normal;
    color:#23A4FF;
}

.jit-chart a {
    color:#23A4FF;
}

.jit-chart #container {
    width: 1000px;
    height: 600px;
    margin:0 auto;
    position:relative;
}

.jit-chart #left-container, 
.jit-chart #right-container, 
.jit-chart #center-container {
    height:600px;
    position:absolute;
    top:0;
}

.jit-chart #left-container,
.jit-chart #right-container {
    width:200px;
    color:#686c70;
    text-align: left;
    overflow: auto;
    background-color:#fff;
    background-repeat:no-repeat;
    border-bottom:1px solid #ddd;
}

.jit-chart #left-container {
    left:0;
    background-image:url('col2.png');
    background-position:center right;
    border-left:1px solid #ddd;
}

.jit-chart #right-container {
    right:0;
    background-image:url('col1.png');
    background-position:center left;
    border-right:1px solid #ddd;
}

.jit-chart #right-container h4 {
    text-indent:8px;
}

.jit-chart #center-container {
    width:600px;
    left:200px;
    background-color:#1a1a1a;
    color:#ccc;
}

.jit-chart .text {
    margin: 7px;
}

.jit-chart #inner-details {
    font-size:0.8em;
    list-style:none;
    margin:7px;
}

.jit-chart #log {
    position:absolute;
    top:10px;
    font-size:1.0em;
    font-weight:bold;
    color:#23A4FF;
}

.jit-chart #infovis {
    position:relative;
    width:600px;
    height:600px;
    margin:auto;
    overflow:hidden;
}

/* TOOLTIPS */
.jit-chart .tip {
    color: #111;
    width: 139px;
    background-color: white;
    border:1px solid #ccc;
    -moz-box-shadow:#555 2px 2px 8px;
    -webkit-box-shadow:#555 2px 2px 8px;
    -o-box-shadow:#555 2px 2px 8px;
    box-shadow:#555 2px 2px 8px;
    opacity:0.9;
    filter:alpha(opacity=90);
    font-size:10px;
    font-family:Verdana, Geneva, Arial, Helvetica, sans-serif;
    padding:7px;
}
.d3-tooltip {
  position: fixed;
  z-index: 9999;
  font-family: Roboto, sans-serif;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
